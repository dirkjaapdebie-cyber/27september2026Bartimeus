<!DOCTYPE html>
<html lang="nl">
<head>
    ...
    <style>
        ...
        /* Touch-friendly tweaks */
        .btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="loginScreen" class="container">
        ...
    </div>

    <!-- Game -->
    <div id="gameScreen" class="container hidden">
        <h1>Bouw het Oog! 👁️</h1>
        <p>Lees de omschrijving...</p>
        <div id="game-container">
            <div id="info-box">
                <h2>Omschrijving:</h2>
                <div id="description">Laden...</div>
            </div>
            <div id="interactive-area">
                <div class="target-term" id="target-title">Zoek het juiste onderdeel</div>
                <div class="options-grid" id="options-container"></div>
                <div id="score-board">Voortgang: <span id="progress">0</span> / 8</div>
                <button id="reset-btn" onclick="startGame()">Opnieuw Spelen</button>
            </div>
        </div>
        <br>
        <button class="btn btn-green" onclick="showSection('factsSection')">Volgende: De Weetjes ➡️</button>
    </div>

    <!-- Weetjes -->
    <div id="factsSection" class="container hidden">
        <h2>🧠 Weetjes over je ogen</h2>
        <div class="slideshow-container">
            <button class="slide-btn prev" onclick="changeSlide(-1)">❮</button>
            <div id="slideText">Slide 1</div>
            <button class="slide-btn next" onclick="changeSlide(1)">❯</button>
        </div>
        <button class="btn btn-blue" onclick="startQuiz()">Start de Waar/Niet Waar Quiz! 🎲</button>
        <div id="quizSection" class="hidden" style="margin-top: 20px;">
            ...
        </div>
        <br><br>
        <button class="btn btn-green" onclick="showSection('storySection')">Volgende: Het Verhaal ➡️</button>
    </div>

    <!-- Verhaal -->
    <div id="storySection" class="container hidden">
        ...
        <button class="btn btn-green" onclick="showSection('stopMotionSection')">Volgende: Stopmotion 🎬</button>
    </div>

    <!-- Stopmotion -->
    <div id="stopMotionSection" class="container hidden">
        ...
    </div>
</body>
</html>
